name: Render serious king theme

on:
  pull_request:
    paths:
      - 'Tools/render_king_serious.py'
      - '.github/render-trigger/king-serious-*'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libfluidsynth-dev ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy mido pyfluidsynth gdown
      - name: Download UNDERTALE Soundfont 2
        run: |
          mkdir -p soundfonts
          gdown 'https://drive.google.com/uc?id=1QRtU4HBE8k3uqxA957TccN5a-RB8N6_L' -O soundfonts/UNDERTALE_Soundfont_2.sf2
          test -s soundfonts/UNDERTALE_Soundfont_2.sf2
      - name: Render serious king theme
        run: |
          python Tools/render_king_serious.py \
            --soundfont soundfonts/UNDERTALE_Soundfont_2.sf2 \
            --out Build/KingSerious
      - name: Upload rendered theme
        uses: actions/upload-artifact@v4
        with:
          name: King-Serious-No-Sax
          path: Build/KingSerious/*
          if-no-files-found: error
          retention-days: 7
