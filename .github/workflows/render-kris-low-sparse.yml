name: Render Kris low sparse SGM theme

on:
  pull_request:
    paths:
      - '.github/render-trigger/kris-low-sparse.txt'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libfluidsynth-dev ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy mido pyfluidsynth
      - name: Download exact SGM V2.01 parts
        run: |
          set -euxo pipefail
          mkdir -p soundfonts/part1 soundfonts/part2 soundfonts/part3
          base='https://github.com/open-soundfonts/SGM_V2_01_soundfonts/raw/refs/heads/master'
          curl -fL --retry 5 "$base/SGM_V2_01_part1.sf2.tar.gz" -o p1.tar.gz
          curl -fL --retry 5 "$base/SGM_V2_01_part2.sf2.tar.gz" -o p2.tar.gz
          curl -fL --retry 5 "$base/SGM_V2_01_part3.sf2.tar.gz" -o p3.tar.gz
          tar -xzf p1.tar.gz -C soundfonts/part1
          tar -xzf p2.tar.gz -C soundfonts/part2
          tar -xzf p3.tar.gz -C soundfonts/part3
      - name: Restore renderer
        run: |
          cat > renderer.py.gz.b64 <<'B64'
          
          B64
          sed -i 's/^          //' renderer.py.gz.b64
          base64 -d renderer.py.gz.b64 | gzip -d > renderer.py
          python -m py_compile renderer.py
      - name: Render exact SGM draft
        run: |
          part1="$(find soundfonts/part1 -type f -name '*.sf2' | head -n1)"
          part2="$(find soundfonts/part2 -type f -name '*.sf2' | head -n1)"
          part3="$(find soundfonts/part3 -type f -name '*.sf2' | head -n1)"
          python renderer.py --part1 "$part1" --part2 "$part2" --part3 "$part3" --out Build/KrisLowSparse
      - name: Upload draft
        uses: actions/upload-artifact@v4
        with:
          name: Kris-The-Room-Remembers
          path: Build/KrisLowSparse/*
          if-no-files-found: error
          retention-days: 7
