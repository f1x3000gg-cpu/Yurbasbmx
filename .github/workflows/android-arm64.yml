name: Build Hamster Flip ARM64

on:
  workflow_dispatch:
  push:
    branches: [CODEX]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-arm64.yml'
  pull_request:
    branches: [CODEX]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity license credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::No UNITY_LICENSE or UNITY_SERIAL secret exists in this repository. Unity cannot legally start IL2CPP compilation without activation."
            exit 12
          fi
          if [ -n "$UNITY_SERIAL" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::UNITY_SERIAL exists, but UNITY_EMAIL or UNITY_PASSWORD is missing."
            exit 13
          fi
          echo "Unity activation credentials are present."

      - name: Build Unity Android ARM64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 2022.3.62f2
          targetPlatform: Android
          buildMethod: HamsterFlip.Editor.AndroidBuilder.BuildArm64FromCommandLine
          androidExportType: androidPackage
          customParameters: -nographics

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamsterFlip-ARM64-APK
          path: Build/Android/HamsterFlip_ARM64.apk
          if-no-files-found: error
