name: Build Native Hamster APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'HamsterNative/**'
      - '.github/workflows/native-hamster.yml'
  push:
    branches: [CODEX]
    paths:
      - 'HamsterNative/**'
      - '.github/workflows/native-hamster.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: HamsterNative
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --no-daemon > build.log 2>&1
          code=$?
          tail -n 160 build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HamsterFlip-Build-Log
          path: HamsterNative/build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamsterFlip-Native-APK
          path: HamsterNative/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
