name: Render Undertale-instrument melody

on:
  pull_request:
    paths:
      - 'Tools/render_undertale_melody.py'
      - '.github/render-trigger/undertale-melody-*'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth libfluidsynth-dev ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy mido pyfluidsynth sf2utils gdown

      - name: Download compiled UNDERTALE Soundfont 2
        run: |
          set -euxo pipefail
          mkdir -p soundfonts
          gdown 'https://drive.google.com/uc?id=1QRtU4HBE8k3uqxA957TccN5a-RB8N6_L' -O soundfonts/UNDERTALE_Soundfont_2.sf2
          test -s soundfonts/UNDERTALE_Soundfont_2.sf2
          ls -lh soundfonts/UNDERTALE_Soundfont_2.sf2

      - name: Render melody and full arrangement
        run: |
          python Tools/render_undertale_melody.py \
            --soundfont soundfonts/UNDERTALE_Soundfont_2.sf2 \
            --out Build/UndertaleMelody

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: Kris-Melody-First-Undertale-Instruments
          path: Build/UndertaleMelody/*
          if-no-files-found: error
          retention-days: 7
