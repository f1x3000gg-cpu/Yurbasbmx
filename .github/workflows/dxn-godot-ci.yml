name: DXN Godot 4.7.1 CI

on:
  pull_request:
    branches: [CODEX]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-runtime-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Rebuild DXN source archive
        shell: bash
        run: |
          set -euo pipefail
          cat dxn_ci/chunks/chunk_* > /tmp/dxn.tar.xz.b64
          base64 --decode /tmp/dxn.tar.xz.b64 > /tmp/dxn.tar.xz
          tar -xJf /tmp/dxn.tar.xz
          test -f dxn_car_sandbox_v5/project.godot
          find dxn_car_sandbox_v5 -type f | sort

      - name: Apply ordered DXN revisions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          revision_patches=(dxn_ci/patches/revision_*.patch)
          if [ ${#revision_patches[@]} -eq 0 ]; then
            echo "No DXN revision patches found"
            exit 1
          fi
          for revision_patch in "${revision_patches[@]}"; do
            echo "Applying ${revision_patch}"
            patch --batch --forward -p0 < "${revision_patch}"
          done

      - name: Apply strict test overrides
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode dxn_ci/overrides/tests_v08.tar.xz.b64 > /tmp/tests_v08.tar.xz
          tar -xJf /tmp/tests_v08.tar.xz
          test -f dxn_car_sandbox_v5/tests/vehicle_integration_tests.gd
          patch --batch --forward -p0 < dxn_ci/post_overrides/revision_09_test_peak.patch

      - name: Install Godot 4.7.1 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "GODOT=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Confirm exact engine
        run: "$GODOT --version"

      - name: Import project and parse resources
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path dxn_car_sandbox_v5 --editor --quit 2>&1 | tee /tmp/dxn-import.log

      - name: Load every GDScript recursively
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path dxn_car_sandbox_v5 --script res://tests/parse_all.gd 2>&1 | tee /tmp/dxn-parse.log

      - name: Run vehicle physics unit tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path dxn_car_sandbox_v5 --script res://tests/physics_unit_tests.gd 2>&1 | tee /tmp/dxn-physics.log

      - name: Run strict main-scene drive and brake test
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path dxn_car_sandbox_v5 --script res://tests/runtime_smoke.gd 2>&1 | tee /tmp/dxn-runtime.log

      - name: Run curb and suspension integration test
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 "$GODOT" --headless --path dxn_car_sandbox_v5 --script res://tests/vehicle_integration_tests.gd 2>&1 | tee /tmp/dxn-integration.log

      - name: Reject hidden Godot diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/dxn-import.log /tmp/dxn-parse.log /tmp/dxn-physics.log /tmp/dxn-runtime.log /tmp/dxn-integration.log > /tmp/dxn-combined.log
          if grep -E 'SCRIPT ERROR:|DXN_PARSE_ALL_FAIL|DXN_RUNTIME_SMOKE_FAIL|DXN_VEHICLE_INTEGRATION_FAIL|FAIL:' /tmp/dxn-combined.log; then
            echo "DXN strict diagnostics found a failure"
            exit 1
          fi
          if grep -E '^ERROR:' /tmp/dxn-combined.log | grep -v 'resources still in use at exit' | grep -v 'RID allocations'; then
            echo "DXN strict diagnostics found a non-cleanup Godot error"
            exit 1
          fi
          grep -F 'DXN_PARSE_ALL_PASS' /tmp/dxn-parse.log
          grep -F 'DXN_PHYSICS_TESTS passed=53 total=53 failures=0' /tmp/dxn-physics.log
          grep -F 'DXN_RUNTIME_SMOKE_PASS' /tmp/dxn-runtime.log
          grep -F 'DXN_VEHICLE_INTEGRATION_PASS' /tmp/dxn-integration.log

      - name: Package validated project
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dxn_car_sandbox_v5/.godot
          zip -qr DXN_CAR_SANDBOX_v5_GODOT_VALIDATED.zip dxn_car_sandbox_v5

      - name: Upload validated build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DXN-CAR-SANDBOX-v5-GODOT-VALIDATED
          path: DXN_CAR_SANDBOX_v5_GODOT_VALIDATED.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DXN-CAR-SANDBOX-v5-VALIDATION-LOGS
          path: /tmp/dxn-*.log
          if-no-files-found: ignore
          retention-days: 30
